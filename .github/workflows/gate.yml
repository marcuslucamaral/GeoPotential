# The full gate, on a machine that is not the author's.
#
# This project's own rule is that a claim is worth what its gate is worth. The
# README says "37 of 37 checks, 1000 tests"; running that here is what makes
# the number checkable by someone who has cloned nothing.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first. Nothing is learned from finishing a run
# against a commit that is already history.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Qt needs its X and EGL libraries present even to render offscreen, and
      # the runner has no GPU. Mesa's llvmpipe provides OpenGL in software, so
      # the scene graph takes the same path it takes on a developer machine
      # rather than a reduced one — a gate that renders differently from the
      # product is not gating the product.
      - name: System libraries for Qt and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libegl-mesa0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 \
            libdbus-1-3 libfontconfig1 libfreetype6 libxrandr2 libxi6 \
            libsm6 libice6 libxcomposite1 libxdamage1 libxtst6

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Report the environment the gate ran in
        run: |
          python -c "
          import sys, importlib
          print(sys.version)
          for m in ('PySide6','numpy','scipy','pandas','rasterio','geopandas','pyproj','shapely'):
              try:
                  print(f'  {m:12} {importlib.import_module(m).__version__}')
              except Exception as e:
                  print(f'  {m:12} MISSING — {e}')
          "

      # Under a real X server rather than only offscreen, so the one check that
      # opens a window and uses it runs instead of reporting BLOCKED. Every
      # other check sets its own platform and is unaffected.
      - name: Gate
        run: xvfb-run -a --server-args="-screen 0 1440x880x24" ./tools/run_gate.sh

      # A green tick says the gate passed. When it does not, the reason should
      # not require re-running anything locally.
      - name: Keep the evidence a failing run produced
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-output
          path: |
            docs/validation/images/**/frames.json
            docs/validation/images/**/STORYBOARD.md
          if-no-files-found: ignore
          retention-days: 14
